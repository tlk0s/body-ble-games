; ESP32-C3 SuperMini + GY-521 motion test (USB power, Serial only)
[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Serial over USB-C (required on most SuperMini boards)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFWD_AXIS=2
; MPU faces TV: try FWD_AXIS 0..5 if tilt maps wrong (0=+X 1=+Y 2=+Z 3=-X 4=-Y 5=-Z)
; Avoid monitor open resetting into weird state on some cables
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; If scan shows nothing on GPIO 8/9, try: pio run -e esp32-c3-supermini-i2c67 -t upload
[env:esp32-c3-supermini-i2c67]
extends = env:esp32-c3-supermini
build_flags =
    ${env:esp32-c3-supermini.build_flags}
    -DPIN_SDA=6
    -DPIN_SCL=7

; Flash blue-button unit with boy hero:
[env:esp32-c3-blue-boy]
extends = env:esp32-c3-supermini
build_flags =
    ${env:esp32-c3-supermini.build_flags}
    -DCONTROLLER_VARIANT=0

; Flash red-button unit with girl hero:
[env:esp32-c3-red-girl]
extends = env:esp32-c3-supermini
build_flags =
    ${env:esp32-c3-supermini.build_flags}
    -DCONTROLLER_VARIANT=1
